name: Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Data Lock"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force release even if package version did not change on the latest push"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.detect.outputs.release_needed }}
      reason: ${{ steps.detect.outputs.reason }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Detect release trigger
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          release_needed="false"
          reason="version_unchanged"
          force="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}"

          if [[ "$force" == "true" ]]; then
            release_needed="true"
            reason="manual_force"
          else
            before_sha="${{ github.event.before }}"
            previous_version=""
            if [[ -n "$before_sha" ]] && git cat-file -e "${before_sha}:package.json" 2>/dev/null; then
              previous_version="$(git show "${before_sha}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{process.stdout.write('')}})")"
            fi

            if [[ -z "$previous_version" || "$previous_version" != "$version" ]]; then
              release_needed="true"
              reason="version_changed"
            fi
          fi

          if git rev-parse "$tag" >/dev/null 2>&1 && [[ "$force" != "true" ]]; then
            release_needed="false"
            reason="tag_exists"
          fi

          echo "release_needed=${release_needed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          echo "[release] force=$force"
          echo "[release] previous_version=${previous_version:-"(unknown)"}"
          echo "[release] current_version=${version}"
          echo "[release] release_needed=${release_needed} reason=${reason} tag=${tag}"

      - name: Summary
        run: |
          echo "release_needed=${{ steps.detect.outputs.release_needed }}"
          echo "reason=${{ steps.detect.outputs.reason }}"
          echo "version=${{ steps.detect.outputs.version }}"
          echo "tag=${{ steps.detect.outputs.tag }}"
          {
            echo "## Release Detect Summary"
            echo ""
            echo "- release_needed: \`${{ steps.detect.outputs.release_needed }}\`"
            echo "- reason: \`${{ steps.detect.outputs.reason }}\`"
            echo "- version: \`${{ steps.detect.outputs.version }}\`"
            echo "- tag: \`${{ steps.detect.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify_release:
    needs: detect
    if: needs.detect.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lock manifest
        run: npm run data:verify-lock

      - name: Run unit tests
        run: npm run test:unit

      - name: Run tests
        run: npm test

  build_package:
    needs: [detect, verify_release]
    if: needs.detect.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build npm package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/npm
          npm pack --pack-destination release-assets/npm
          ls -lah release-assets/npm
          echo "[release] npm pack artifacts:"
          find release-assets/npm -maxdepth 1 -type f -name "*.tgz" -print

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack
          path: release-assets/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  build_prebuilt_rag:
    needs: [detect, verify_release]
    if: needs.detect.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RAG_PREWARM: "true"
      RAG_PREWARM_BLOCK: "true"
      RAG_REBUILD: "true"
      PREBUILT_GEMINI_CACHE_DIR: ${{ github.workspace }}/release-assets/prebuilt-rag/gemini/cache
      PREBUILT_GEMINI_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/release-rag-models-gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EMBED_BATCH_SIZE: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Ensure Gemini API key is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "GEMINI_API_KEY secret is required for Gemini prebuild."
            exit 1
          fi

      - name: Prebuild gemini RAG index
        env:
          RAG_PROVIDER: gemini
          RAG_FALLBACK: none
          RAG_REBUILD: "true"
          RAG_CACHE_DIR: ${{ env.PREBUILT_GEMINI_CACHE_DIR }}
          RAG_MODEL_CACHE_DIR: ${{ env.PREBUILT_GEMINI_MODEL_CACHE_DIR }}
        run: npm run rag:prebuild

      - name: Show prebuilt RAG output
        shell: bash
        run: |
          set -euo pipefail
          echo "[release] gemini prebuilt rag cache dir: $PREBUILT_GEMINI_CACHE_DIR"
          if [[ -d "$PREBUILT_GEMINI_CACHE_DIR" ]]; then
            find "$PREBUILT_GEMINI_CACHE_DIR" -maxdepth 2 -type f -print
          else
            echo "[release] gemini cache dir missing"
          fi

      - name: Upload prebuilt RAG artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-rag-index
          path: release-assets/prebuilt-rag/**
          if-no-files-found: error
          retention-days: 14

      - name: Stage hydrated release data artifact
        shell: bash
        run: |
          set -euo pipefail
          staged_root="release-assets/hydrated-data/data"
          mkdir -p "$staged_root"
          cp -R data/metadata "$staged_root/metadata"
          cp -R data/documentation "$staged_root/documentation"
          cp -R data/samples "$staged_root/samples"

      - name: Upload hydrated release data artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrated-release-data
          path: release-assets/hydrated-data/**
          if-no-files-found: error
          retention-days: 14

  create_release:
    needs: [detect, build_package, build_prebuilt_rag]
    if: needs.detect.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-pack
          path: release-assets/npm

      - name: Download prebuilt RAG artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-rag-index
          path: release-assets/prebuilt-rag

      - name: Create release asset archives for prebuilt RAG indexes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.detect.outputs.version }}"
          tar -czf "release-assets/prebuilt-rag-index-gemini-${version}.tar.gz" -C release-assets/prebuilt-rag gemini
          ls -lah release-assets
          ls -lah release-assets/npm
          echo "[release] prebuilt archive ready release-assets/prebuilt-rag-index-gemini-${version}.tar.gz"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/npm/*.tgz
            release-assets/prebuilt-rag-index-gemini-${{ needs.detect.outputs.version }}.tar.gz

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- tag: \`${{ needs.detect.outputs.tag }}\`"
            echo "- version: \`${{ needs.detect.outputs.version }}\`"
            echo "- npm_artifacts: \`release-assets/npm/*.tgz\`"
            echo "- prebuilt_rag_gemini: \`release-assets/prebuilt-rag-index-gemini-${{ needs.detect.outputs.version }}.tar.gz\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish_npm:
    needs: [detect, create_release]
    if: needs.detect.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check npm publish status
        id: npm_status
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="${{ needs.detect.outputs.version }}"

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "[release] npm already has ${package_name}@${version}; skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "[release] npm publish required for ${package_name}@${version}"
          fi

      - name: Publish package to npm
        if: steps.npm_status.outputs.already_published != 'true'
        run: npm publish --access public

      - name: npm summary
        shell: bash
        run: |
          {
            echo "## npm Publish Summary"
            echo ""
            echo "- package: \`${{ steps.npm_status.outputs.package_name }}\`"
            echo "- version: \`${{ needs.detect.outputs.version }}\`"
            echo "- already_published: \`${{ steps.npm_status.outputs.already_published }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_azure:
    needs: [detect, publish_npm, build_prebuilt_rag]
    if: needs.detect.outputs.release_needed == 'true'
    uses: ./.github/workflows/deploy-aca.yml
    with:
      version: ${{ needs.detect.outputs.version }}
      tag: ${{ needs.detect.outputs.tag }}
      image_repository: simple-dynamsoft-mcp
      data_artifact_name: hydrated-release-data
      rag_artifact_name: prebuilt-rag-index
    secrets: inherit
