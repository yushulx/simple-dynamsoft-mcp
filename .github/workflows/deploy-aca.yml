name: Deploy to Azure Container Apps

on:
  workflow_call:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      image_repository:
        description: Image repository name inside registry
        required: false
        default: simple-dynamsoft-mcp
        type: string
      data_artifact_name:
        description: Optional artifact name containing hydrated data tree
        required: false
        default: ""
        type: string
      rag_artifact_name:
        description: Optional artifact name containing prebuilt RAG indexes
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      image_repository:
        description: Image repository name inside registry
        required: false
        default: simple-dynamsoft-mcp
        type: string
      data_artifact_name:
        description: Optional artifact name containing hydrated data tree
        required: false
        default: ""
        type: string
      rag_artifact_name:
        description: Optional artifact name containing prebuilt RAG indexes
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deployment variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"
          image_repo="${{ inputs.image_repository }}"

          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          app="${{ vars.AZURE_CONTAINER_APP_NAME }}"
          acr_name="${{ vars.AZURE_CONTAINER_REGISTRY }}"
          acr_login="${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}"
          storage_account="${{ vars.AZURE_CACHE_STORAGE_ACCOUNT }}"
          cache_share="${{ vars.AZURE_CACHE_FILE_SHARE }}"

          if [[ -z "$rg" || -z "$app" || -z "$acr_name" ]]; then
            echo "AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP_NAME, and AZURE_CONTAINER_REGISTRY are required repository/environment variables."
            exit 1
          fi

          if [[ -z "$acr_login" ]]; then
            acr_login="${acr_name}.azurecr.io"
          fi

          if [[ -z "$storage_account" ]]; then
            storage_account="simpledynamsoftmcpsa"
          fi

          if [[ -z "$cache_share" ]]; then
            cache_share="mcp-cache"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"
          echo "resource_group=$rg" >> "$GITHUB_OUTPUT"
          echo "container_app=$app" >> "$GITHUB_OUTPUT"
          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_login=$acr_login" >> "$GITHUB_OUTPUT"
          echo "storage_account=$storage_account" >> "$GITHUB_OUTPUT"
          echo "cache_share=$cache_share" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.vars.outputs.acr_name }}"

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_base="${{ steps.vars.outputs.acr_login }}/${{ steps.vars.outputs.image_repo }}"
          version_tag="$image_base:${{ steps.vars.outputs.tag }}"
          sha_tag="$image_base:sha-${GITHUB_SHA}"

          docker build -t "$version_tag" -t "$sha_tag" .
          docker push "$version_tag"
          docker push "$sha_tag"

          echo "image_ref=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Download hydrated data artifact
        if: ${{ inputs.data_artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.data_artifact_name }}
          path: ${{ runner.temp }}/hydrated-data-artifact

      - name: Download prebuilt RAG artifact
        if: ${{ inputs.rag_artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.rag_artifact_name }}
          path: ${{ runner.temp }}/prebuilt-rag-artifact

      - name: Prepare data cache on runner
        id: prepare_data
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.vars.outputs.version }}"
          cache_root="$RUNNER_TEMP/mcp-cache/${version}"
          data_root="${cache_root}/data"
          artifact_name="${{ inputs.data_artifact_name }}"
          artifact_root="${RUNNER_TEMP}/hydrated-data-artifact"
          artifact_data_root="${artifact_root}/data"

          mkdir -p "$data_root"

          if [[ -n "$artifact_name" ]]; then
            if [[ ! -d "$artifact_data_root" ]]; then
              echo "Expected hydrated data artifact content at $artifact_data_root"
              exit 1
            fi
            cp -R "$artifact_data_root/." "$data_root/"
            echo "data_source=artifact" >> "$GITHUB_OUTPUT"
          else
            npm run data:bootstrap
            cp -R data/metadata "$data_root/metadata"
            cp -R data/documentation "$data_root/documentation"
            cp -R data/samples "$data_root/samples"
            echo "data_source=submodule-bootstrap" >> "$GITHUB_OUTPUT"
          fi

          for required_path in \
            "metadata/dynamsoft_sdks.json" \
            "metadata/data-manifest.json" \
            "documentation" \
            "samples"; do
            if [[ ! -e "${data_root}/${required_path}" ]]; then
              echo "Prepared data is missing required path: ${data_root}/${required_path}"
              exit 1
            fi
          done

          echo "cache_root=$cache_root" >> "$GITHUB_OUTPUT"
          echo "data_root=$data_root" >> "$GITHUB_OUTPUT"

      - name: Upload hydrated cache to Azure Files
        shell: bash
        run: |
          set -euo pipefail

          account="${{ steps.vars.outputs.storage_account }}"
          share="${{ steps.vars.outputs.cache_share }}"
          version="${{ steps.vars.outputs.version }}"
          local_data="${{ steps.prepare_data.outputs.data_root }}"

          key="$(az storage account keys list --account-name "$account" --query "[0].value" -o tsv)"

          az storage directory create \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --name "$version" >/dev/null

          az storage directory create \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --name "$version/data" >/dev/null

          az storage file upload-batch \
            --account-name "$account" \
            --account-key "$key" \
            --source "$local_data" \
            --destination "$share" \
            --destination-path "$version/data" \
            --max-connections 64 \
            --only-show-errors \
            -o none

      - name: Upload Gemini prebuilt RAG cache to Azure Files
        if: ${{ inputs.rag_artifact_name != '' }}
        shell: bash
        run: |
          set -euo pipefail

          account="${{ steps.vars.outputs.storage_account }}"
          share="${{ steps.vars.outputs.cache_share }}"
          version="${{ steps.vars.outputs.version }}"
          artifact_root="$RUNNER_TEMP/prebuilt-rag-artifact"
          key="$(az storage account keys list --account-name "$account" --query "[0].value" -o tsv)"

          gemini_cache_dir=""
          for candidate in \
            "$artifact_root/gemini/cache" \
            "$artifact_root/prebuilt-rag/gemini/cache" \
            "$artifact_root/release-assets/prebuilt-rag/gemini/cache"; do
            if [[ -d "$candidate" ]]; then
              gemini_cache_dir="$candidate"
              break
            fi
          done

          if [[ -z "$gemini_cache_dir" ]]; then
            echo "Could not find gemini prebuilt cache directory in artifact root: $artifact_root"
            exit 1
          fi

          az storage directory create \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --name "$version/rag" >/dev/null

          az storage directory create \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --name "$version/rag/cache" >/dev/null

          az storage file upload-batch \
            --account-name "$account" \
            --account-key "$key" \
            --source "$gemini_cache_dir" \
            --destination "$share" \
            --destination-path "$version/rag/cache" \
            --max-connections 64 \
            --only-show-errors \
            -o none

      - name: Verify uploaded cache data readiness
        shell: bash
        run: |
          set -euo pipefail

          account="${{ steps.vars.outputs.storage_account }}"
          share="${{ steps.vars.outputs.cache_share }}"
          version="${{ steps.vars.outputs.version }}"

          key="$(az storage account keys list --account-name "$account" --query "[0].value" -o tsv)"

          for required_path in \
            "metadata/dynamsoft_sdks.json" \
            "metadata/data-manifest.json"; do
            file_exists="$(az storage file exists \
              --account-name "$account" \
              --account-key "$key" \
              --share-name "$share" \
              --path "$version/data/${required_path}" \
              --query exists \
              -o tsv)"

            if [[ "$file_exists" != "true" ]]; then
              echo "Missing uploaded cache file at $version/data/${required_path}"
              exit 1
            fi
          done

          for required_dir in documentation samples; do
            dir_exists="$(az storage directory exists \
              --account-name "$account" \
              --account-key "$key" \
              --share-name "$share" \
              --name "$version/data/${required_dir}" \
              --query exists \
              -o tsv)"

            if [[ "$dir_exists" != "true" ]]; then
              echo "Missing uploaded cache directory at $version/data/${required_dir}"
              exit 1
            fi
          done

      - name: Verify uploaded Gemini prebuilt RAG cache
        if: ${{ inputs.rag_artifact_name != '' }}
        shell: bash
        run: |
          set -euo pipefail

          account="${{ steps.vars.outputs.storage_account }}"
          share="${{ steps.vars.outputs.cache_share }}"
          version="${{ steps.vars.outputs.version }}"
          key="$(az storage account keys list --account-name "$account" --query "[0].value" -o tsv)"

          rag_dir_exists="$(az storage directory exists \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --name "$version/rag/cache" \
            --query exists \
            -o tsv)"

          if [[ "$rag_dir_exists" != "true" ]]; then
            echo "Missing uploaded RAG cache directory at $version/rag/cache"
            exit 1
          fi

          file_count="$(az storage file list \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --path "$version/rag/cache" \
            --query "length(@)" \
            -o tsv)"

          if [[ "$file_count" == "0" ]]; then
            echo "Uploaded RAG cache directory is empty at $version/rag/cache"
            exit 1
          fi

      - name: Configure ACA registry auth (managed identity)
        shell: bash
        run: |
          set -euo pipefail
          az containerapp registry set \
            --name "${{ steps.vars.outputs.container_app }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --server "${{ steps.vars.outputs.acr_login }}" \
            --identity system

      - name: Capture previous active revisions
        id: pre_revisions
        shell: bash
        run: |
          set -euo pipefail

          az containerapp revision list \
            --name "${{ steps.vars.outputs.container_app }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --query "[?properties.active].name" \
            -o tsv > /tmp/old_revisions.txt || true

          echo "old_revisions_file=/tmp/old_revisions.txt" >> "$GITHUB_OUTPUT"

      - name: Deploy single steady revision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.vars.outputs.version }}"
          cache_root="/mnt/mcp-cache/${version}"
          data_root="${cache_root}/data"
          safe_version="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')"
          revision_suffix="$(printf '%s-%s' "$safe_version" "$GITHUB_RUN_NUMBER" | tr -s '-' | cut -c1-63)"
          revision_suffix="${revision_suffix%-}"

          if [[ -z "$revision_suffix" ]]; then
            revision_suffix="r${GITHUB_RUN_NUMBER}"
          fi

          az containerapp update \
            --name "${{ steps.vars.outputs.container_app }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --image "${{ steps.image.outputs.image_ref }}" \
            --revision-suffix "$revision_suffix" \
            --min-replicas 0 \
            --max-replicas 1 \
            --set-env-vars \
              MCP_DATA_AUTO_DOWNLOAD=false \
              MCP_DATA_DIR="$data_root" \
              MCP_LOG_LEVEL=info \
              MCP_DATA_CACHE_DIR="${cache_root}/data" \
              RAG_CACHE_DIR="${cache_root}/rag/cache" \
              RAG_MODEL_CACHE_DIR="${cache_root}/rag/models" \
              TMPDIR="${cache_root}/tmp" \
              TMP="${cache_root}/tmp" \
              TEMP="${cache_root}/tmp"

      - name: Wait for deployed revision ready
        id: ready
        shell: bash
        run: |
          set -euo pipefail

          app="${{ steps.vars.outputs.container_app }}"
          rg="${{ steps.vars.outputs.resource_group }}"

          deployed_revision="$(az containerapp show --name "$app" --resource-group "$rg" --query properties.latestRevisionName -o tsv)"
          echo "deployed_revision=$deployed_revision" >> "$GITHUB_OUTPUT"

          for i in {1..40}; do
            ready_revision="$(az containerapp show --name "$app" --resource-group "$rg" --query properties.latestReadyRevisionName -o tsv)"
            if [[ "$ready_revision" == "$deployed_revision" ]]; then
              echo "Deployed revision is ready: $deployed_revision"
              exit 0
            fi
            sleep 15
          done

          echo "Timed out waiting for deployed revision to become ready."
          exit 1

      - name: Route traffic to deployed revision
        shell: bash
        run: |
          set -euo pipefail

          az containerapp ingress traffic set \
            --name "${{ steps.vars.outputs.container_app }}" \
            --resource-group "${{ steps.vars.outputs.resource_group }}" \
            --revision-weight "${{ steps.ready.outputs.deployed_revision }}=100"

      - name: Deactivate old revisions
        shell: bash
        run: |
          set -euo pipefail

          app="${{ steps.vars.outputs.container_app }}"
          rg="${{ steps.vars.outputs.resource_group }}"
          current="${{ steps.ready.outputs.deployed_revision }}"

          while read -r revision; do
            if [[ -n "$revision" && "$revision" != "$current" ]]; then
              echo "Deactivating old revision: $revision"
              az containerapp revision deactivate \
                --name "$app" \
                --resource-group "$rg" \
                --revision "$revision" || true
            fi
          done < "${{ steps.pre_revisions.outputs.old_revisions_file }}"

      - name: Clean up old cache versions in Azure Files
        shell: bash
        run: |
          set -euo pipefail

          account="${{ steps.vars.outputs.storage_account }}"
          share="${{ steps.vars.outputs.cache_share }}"
          current_version="${{ steps.vars.outputs.version }}"

          if ! key="$(timeout -k 30s 180s az storage account keys list \
            --account-name "$account" \
            --query "[0].value" \
            --only-show-errors \
            -o tsv)"; then
            echo "::warning::Azure Files cache cleanup skipped because storage account key lookup failed"
            exit 0
          fi

          if ! dirs_output="$(timeout -k 30s 180s az storage file list \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --num-results "*" \
            --query "[?properties.contentLength == null].name" \
            --only-show-errors \
            -o tsv)"; then
            echo "::warning::Azure Files cache cleanup skipped because the initial directory scan failed"
            exit 0
          fi

          if [[ -n "$dirs_output" ]]; then
            mapfile -t dirs <<< "$dirs_output"
          else
            dirs=()
          fi

          version_regex='^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z]+)*$'
          versioned_dirs=()
          for dir in "${dirs[@]}"; do
            if [[ -n "$dir" && "$dir" =~ $version_regex ]]; then
              versioned_dirs+=("$dir")
            fi
          done

          if (( ${#versioned_dirs[@]} == 0 )); then
            echo "No versioned cache directories found; skipping cleanup"
            exit 0
          fi

          mapfile -t sorted_versions < <(printf '%s\n' "${versioned_dirs[@]}" | sort -V)
          keep_versions=("$current_version")
          current_index=-1
          for i in "${!sorted_versions[@]}"; do
            if [[ "${sorted_versions[$i]}" == "$current_version" ]]; then
              current_index="$i"
              break
            fi
          done

          if (( current_index > 0 )); then
            previous_version="${sorted_versions[$((current_index - 1))]}"
            keep_versions+=("$previous_version")
          fi

          should_keep() {
            local candidate="$1"
            for keep in "${keep_versions[@]}"; do
              if [[ "$candidate" == "$keep" ]]; then
                return 0
              fi
            done
            return 1
          }

          cleanup_failed=0
          cleanup_started_at="$SECONDS"
          cleanup_deadline_seconds=1800

          run_cleanup_command() {
            local label="$1"
            local exit_code
            shift

            if timeout -k 30s 180s "$@"; then
              return 0
            else
              exit_code="$?"
            fi

            if [[ "$exit_code" -eq 124 || "$exit_code" -eq 137 || "$exit_code" -eq 143 ]]; then
              echo "::warning::Cleanup timed out after up to 210s (180s + 30s grace): ${label}"
            else
              echo "::warning::Cleanup command failed (exit ${exit_code}): ${label}"
            fi

            cleanup_failed=1
            return "$exit_code"
          }

          run_cleanup_capture() {
            local label="$1"
            local output
            local exit_code
            shift

            if output="$(timeout -k 30s 180s "$@" 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi

            exit_code="$?"
            if [[ "$exit_code" -eq 124 || "$exit_code" -eq 137 || "$exit_code" -eq 143 ]]; then
              echo "::warning::Cleanup timed out after up to 210s (180s + 30s grace): ${label}" >&2
            else
              echo "::warning::Cleanup command failed (exit ${exit_code}): ${label}" >&2
            fi

            if [[ -n "$output" ]]; then
              printf '%s\n' "$output" >&2
            fi

            cleanup_failed=1
            return "$exit_code"
          }

          ensure_cleanup_deadline() {
            local label="$1"
            local elapsed_seconds
            elapsed_seconds="$((SECONDS - cleanup_started_at))"

            if (( elapsed_seconds < cleanup_deadline_seconds )); then
              return 0
            fi

            echo "::warning::Cleanup exceeded ${cleanup_deadline_seconds}s overall deadline: ${label}" >&2
            cleanup_failed=1
            return 1
          }

          delete_directory_recursive() {
            local path="$1"
            local child_path
            local file
            local file_output=""
            local subdir
            local subdir_output=""
            local -a files=()
            local -a subdirs=()

            ensure_cleanup_deadline "$path" || return 1

            if ! subdir_output="$(run_cleanup_capture "az storage file list for directories in ${path}" \
              az storage file list \
              --account-name "$account" \
              --account-key "$key" \
              --share-name "$share" \
              --path "$path" \
              --num-results "*" \
              --query "[?properties.contentLength == null].name" \
              --only-show-errors \
              -o tsv)"; then
              cleanup_failed=1
              return 1
            fi

            if [[ -n "$subdir_output" ]]; then
              mapfile -t subdirs <<< "$subdir_output"
            fi

            for subdir in "${subdirs[@]}"; do
              if [[ -z "$subdir" ]]; then
                continue
              fi

              ensure_cleanup_deadline "$path/$subdir" || return 1

              child_path="${path}/${subdir}"
              if ! delete_directory_recursive "$child_path"; then
                cleanup_failed=1
                continue
              fi
            done

            if ! file_output="$(run_cleanup_capture "az storage file list for ${path}" \
              az storage file list \
              --account-name "$account" \
              --account-key "$key" \
              --share-name "$share" \
              --path "$path" \
              --exclude-dir \
              --num-results "*" \
              --query "[].name" \
              --only-show-errors \
              -o tsv)"; then
              cleanup_failed=1
              return 1
            fi

            if [[ -n "$file_output" ]]; then
              mapfile -t files <<< "$file_output"
            fi

            for file in "${files[@]}"; do
              if [[ -z "$file" ]]; then
                continue
              fi

              ensure_cleanup_deadline "$path/$file" || return 1

              if ! run_cleanup_command "az storage file delete for ${path}/${file}" \
                az storage file delete \
                --account-name "$account" \
                --account-key "$key" \
                --share-name "$share" \
                --path "${path}/${file}" \
                --only-show-errors; then
                continue
              fi
            done

            ensure_cleanup_deadline "$path" || return 1

            if ! run_cleanup_command "az storage directory delete for ${path}" \
              az storage directory delete \
              --account-name "$account" \
              --account-key "$key" \
              --share-name "$share" \
              --name "$path" \
              --fail-not-exist; then
              return 1
            fi
          }

          for dir in "${versioned_dirs[@]}"; do
            if should_keep "$dir"; then
              echo "Keeping cache directory: $dir"
              continue
            fi

            echo "Cleaning old cache directory: $dir"
            if ! delete_directory_recursive "$dir"; then
              echo "::warning::Recursive cleanup did not fully delete ${dir}"
            fi
          done

          if [[ "$cleanup_failed" -eq 1 ]]; then
            echo "::warning::Azure Files cache cleanup completed with one or more failures"
          fi

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --name "${{ steps.vars.outputs.container_app }}" --resource-group "${{ steps.vars.outputs.resource_group }}" --query properties.configuration.ingress.fqdn -o tsv)"

          {
            echo "## Azure Deploy Summary"
            echo ""
            echo "- version: \\`${{ steps.vars.outputs.version }}\\`"
            echo "- image: \\`${{ steps.image.outputs.image_ref }}\\`"
            echo "- deployed_revision: \\`${{ steps.ready.outputs.deployed_revision }}\\`"
            echo "- endpoint: \\`https://${fqdn}/mcp\\`"
          } >> "$GITHUB_STEP_SUMMARY"
