name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Verify data source wiring
        run: npm run data:verify-versions:strict

      - name: Test (lite + package runtime)
        run: npm run test:lite

  test_lexical_provider:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDER: lexical
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "false"
      RAG_PREWARM_BLOCK: "false"
      RUN_FUSE_PROVIDER_TESTS: "false"
      RUN_LOCAL_PROVIDER_TESTS: "false"
      RUN_GEMINI_PROVIDER_TESTS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (lexical provider)
        run: npm run test:lexical

  test_lazy_hydration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_package_runtime_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  test_package_runtime_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  test_local_provider:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDER: local
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "true"
      RAG_PREWARM_BLOCK: "true"
      RAG_LOCAL_MODEL: Xenova/all-MiniLM-L6-v2
      RAG_LOCAL_QUANTIZED: "true"
      RAG_CACHE_DIR: ${{ github.workspace }}/.cache/rag-index
      RAG_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/rag-models
      RUN_FUSE_PROVIDER_TESTS: "false"
      RUN_LOCAL_PROVIDER_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore local RAG caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/rag-index
            .cache/rag-models
          key: rag-local-${{ runner.os }}-xenova-all-minilm-l6-v2-${{ hashFiles('package-lock.json', 'data/metadata/data-manifest.json') }}
          restore-keys: |
            rag-local-${{ runner.os }}-xenova-all-minilm-l6-v2-

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Prebuild local RAG index
        run: npm run rag:prebuild

      - name: Test (local provider)
        run: npm run test:local

  test_gemini_provider:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_PROVIDER: gemini
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "true"
      RAG_PREWARM_BLOCK: "true"
      GEMINI_EMBED_BATCH_SIZE: 16
      RAG_CACHE_DIR: ${{ github.workspace }}/.cache/rag-index-gemini
      RUN_FUSE_PROVIDER_TESTS: "false"
      RUN_LOCAL_PROVIDER_TESTS: "false"
      RUN_GEMINI_PROVIDER_TESTS: "true"
    steps:
      - name: Skip when GEMINI_API_KEY is missing
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "Skipping gemini provider job because GEMINI_API_KEY is not configured."

      - name: Checkout
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 20
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore gemini RAG cache
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/cache@v4
        with:
          path: .cache/rag-index-gemini
          key: rag-gemini-${{ runner.os }}-${{ hashFiles('package-lock.json', 'data/metadata/data-manifest.json') }}
          restore-keys: |
            rag-gemini-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm ci

      - name: Unit tests
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:unit

      - name: Bootstrap data
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run data:bootstrap

      - name: Prebuild gemini RAG index
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run rag:prebuild

      - name: Test (gemini provider)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:gemini
