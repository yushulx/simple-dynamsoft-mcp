name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Verify data source wiring
        run: npm run data:verify-versions:strict

      - name: Test (lite + package runtime)
        run: npm run test:lite

  test_lexical_provider:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDER: lexical
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "false"
      RAG_PREWARM_BLOCK: "false"
      RUN_GEMINI_PROVIDER_TESTS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (lexical provider)
        run: npm run test:lexical

  test_lazy_hydration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_lazy_hydration_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_package_runtime_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  test_package_runtime_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  test_gemini_provider:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_PROVIDER: gemini
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "true"
      RAG_PREWARM_BLOCK: "true"
      GEMINI_EMBED_BATCH_SIZE: 16
      RAG_CACHE_DIR: ${{ github.workspace }}/.cache/rag-index-gemini
      RUN_GEMINI_PROVIDER_TESTS: "true"
    steps:
      - name: Skip when GEMINI_API_KEY is missing
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "Skipping gemini provider job because GEMINI_API_KEY is not configured."

      - name: Checkout
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node 24
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore gemini RAG cache
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/cache@v5
        with:
          path: .cache/rag-index-gemini
          key: rag-gemini-${{ runner.os }}-${{ hashFiles('package-lock.json', 'data/metadata/data-manifest.json') }}
          restore-keys: |
            rag-gemini-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm ci

      - name: Unit tests
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:unit

      - name: Bootstrap data
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run data:bootstrap

      - name: Prebuild gemini RAG index
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run rag:prebuild

      - name: Test (gemini provider)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:gemini
